<body>
  <header>
    <h1>Exercise 7: CSS Grid Gallery</h1>
    <p><a href="../index.html">&larr; Back to Home</a></p>
  </header>
  <main>
    <section>
      <h2>Description</h2>
      <p>Demonstrates simple CSS Grid layout.</p>
      <h2>Live Result</h2>
      <div class="demo-box" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
        <div style="background: var(--card-bg); padding: 10px; border: 1px solid var(--border-color); text-align: center;">Grid 1</div>
        <div style="background: var(--card-bg); padding: 10px; border: 1px solid var(--border-color); text-align: center;">Grid 2</div>
        <div style="background: var(--card-bg); padding: 10px; border: 1px solid var(--border-color); text-align: center;">Grid 3</div>
      </div>
    </section>
  </main>
  <footer><p>Shaidullaeva Amina</p></footer>
</body>
