<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13 - Shaidullaeva Amina</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <h1>Exercise 13: CSS Transitions</h1>
    <p><a href="../index.html">&larr; Back to Home</a></p>
  </header>
  <main>
    <section>
      <h2>Description</h2>
      <p>Demonstrates smooth hover transition effects.</p>
      <h2>Live Result</h2>
      <div class="demo-box">
        <button style="padding: 10px 20px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">Hover Me</button>
      </div>
    </section>
  </main>
  <footer><p>Shaidullaeva Amina</p></footer>
</body>
</html>
