<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15 - Shaidullaeva Amina</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <h1>Exercise 15: Accessible Form Design</h1>
    <p><a href="../index.html">&larr; Back to Home</a></p>
  </header>
  <main>
    <section>
      <h2>Description</h2>
      <p>Demonstrates accessible form elements with labels.</p>
      <h2>Live Result</h2>
      <div class="demo-box">
        <form style="display: flex; flex-direction: column; gap: 8px; max-width: 250px;">
          <label for="name-input">Your Name:</label>
          <input type="text" id="name-input" name="name" style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;">
        </form>
      </div>
    </section>
  </main>
  <footer><p>Shaidullaeva Amina</p></footer>
</body>
